<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f0a1a" />
    <meta name="description" content="你在数学课上活成了哪种狠人？12道灵魂拷问，测出你的数学课人设" />
    <title>数学课生存图鉴 — 你在数学课上是哪种狠人？</title>
  </head>
  <body>
    <div class="danmaku-layer" aria-hidden="true">
      <span style="--y:3%;--d:14s;--dl:0s;--s:0.9">这题我会！</span>
      <span style="--y:8%;--d:18s;--dl:-3s;--s:1.1">选C选C！</span>
      <span style="--y:14%;--d:22s;--dl:-7s;--s:0.8">老师别点我</span>
      <span style="--y:20%;--d:16s;--dl:-2s;--s:1.0">三长一短选最短</span>
      <span style="--y:27%;--d:26s;--dl:-10s;--s:0.7">抄完了借我看看</span>
      <span style="--y:33%;--d:20s;--dl:-5s;--s:1.2">蒙就完了</span>
      <span style="--y:40%;--d:15s;--dl:-1s;--s:0.85">答案是42</span>
      <span style="--y:46%;--d:24s;--dl:-8s;--s:0.75">稳了稳了稳了</span>
      <span style="--y:52%;--d:19s;--dl:-12s;--s:1.0">醒醒下课了</span>
      <span style="--y:58%;--d:28s;--dl:-4s;--s:0.65">同桌救命！</span>
      <span style="--y:64%;--d:17s;--dl:-6s;--s:1.05">假装在记笔记</span>
      <span style="--y:70%;--d:21s;--dl:-9s;--s:0.8">这道题选B？</span>
      <span style="--y:76%;--d:25s;--dl:-11s;--s:0.7">数学好难啊</span>
      <span style="--y:82%;--d:13s;--dl:-2s;--s:0.95">我不会但我能蒙对</span>
      <span style="--y:88%;--d:23s;--dl:-7s;--s:0.9">大佬带带我</span>
      <span style="--y:93%;--d:30s;--dl:-15s;--s:0.6">先睡一觉再说</span>
      <span style="--y:6%;--d:29s;--dl:-13s;--s:0.55">x²+y²=算不出来</span>
      <span style="--y:17%;--d:12s;--dl:-3s;--s:1.0">△=b²-4ac</span>
      <span style="--y:30%;--d:27s;--dl:-6s;--s:0.75">π≈3.1415926...</span>
      <span style="--y:43%;--d:18s;--dl:-9s;--s:0.85">1+1=3 差不多</span>
      <span style="--y:55%;--d:31s;--dl:-14s;--s:0.6">卷王退散</span>
      <span style="--y:68%;--d:16s;--dl:-5s;--s:1.1">三长一短选最短</span>
      <span style="--y:80%;--d:22s;--dl:-10s;--s:0.7">S=长×宽 忘了</span>
      <span style="--y:91%;--d:20s;--dl:-8s;--s:0.9">考试前再看一眼</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
